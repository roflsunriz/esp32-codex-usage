title: '[雑談] '
body:
  - type: markdown
    attributes:
      value: |-
        esp32-codex-usageに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。認証コード、Wi-Fi認証情報、NVS・全フラッシュのダンプ、個人設定入りファームウェアも添付しないでください。
  - type: textarea
    id: topic
    attributes:
      label: 話題と背景
      description: プロジェクトについて話したい内容を記載してください。
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 補足
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
