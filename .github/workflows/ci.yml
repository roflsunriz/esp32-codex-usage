name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        task: [quality, native, firmware]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v6
        with:
          path: .local/platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Regenerate embedded setup page
        if: matrix.task == 'quality'
        run: python scripts/embed-web.py

      - name: Verify generated setup page is committed
        if: matrix.task == 'quality'
        run: git diff --exit-code -- include/setup-page.h

      - name: Verify generated display font is committed
        if: matrix.task == 'quality'
        run: python scripts/generate-font.py && git diff --exit-code -- include/japanese-font.h

      - name: Compile Python helpers
        if: matrix.task == 'quality'
        run: python -m compileall -q scripts

      - name: Run Python unit tests
        if: matrix.task == 'quality'
        run: python -m unittest discover -s test -p 'test_*.py'

      - name: Run native tests
        if: matrix.task == 'native'
        run: pio test -e native

      - name: Test setup UI in headless Chrome
        if: matrix.task == 'quality'
        run: python scripts/test-setup-ui.py

      - name: Build ESP32 firmware
        if: matrix.task == 'firmware'
        run: pio run -e cyd

      - name: Upload firmware build outputs
        if: matrix.task == 'firmware'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyd-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            .pio/build/cyd/firmware.bin
            .pio/build/cyd/bootloader.bin
            .pio/build/cyd/partitions.bin
            .pio/build/cyd/firmware.factory.bin
            THIRD-PARTY-NOTICES.md
            LICENSE
