name: Release firmware

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    name: Build and publish tagged firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt

      - name: Extract release notes
        run: python scripts/release-notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Regenerate embedded setup page
        run: python scripts/embed-web.py

      - name: Verify generated setup page is committed
        run: git diff --exit-code -- include/setup-page.h

      - name: Compile Python helpers
        run: python -m compileall -q scripts

      - name: Run Python unit tests
        run: python -m unittest discover -s test -p 'test_*.py'

      - name: Run native tests
        run: pio test -e native

      - name: Test setup UI in headless Chrome
        run: python scripts/test-setup-ui.py

      - name: Build ESP32 firmware
        run: pio run -e cyd

      - name: Generate firmware checksums
        run: |
          (
            cd .pio/build/cyd
            sha256sum firmware.bin firmware.factory.bin bootloader.bin partitions.bin
          ) > "$RUNNER_TEMP/SHA256SUMS"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            .pio/build/cyd/firmware.bin \
            .pio/build/cyd/bootloader.bin \
            .pio/build/cyd/partitions.bin \
            .pio/build/cyd/firmware.factory.bin \
            THIRD-PARTY-NOTICES.md \
            LICENSE \
            "$RUNNER_TEMP/SHA256SUMS#SHA256SUMS"
