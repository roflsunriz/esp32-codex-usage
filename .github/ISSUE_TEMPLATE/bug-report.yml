name: バグ報告
description: 再現可能な不具合を報告する
title: '[Bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |-
        esp32-codex-usageに関する内容を、目的と確認できた事実に分けて記載してください。
        Cookie、認証トークン、パスワード、個人情報を本文や添付に含めないでください。認証コード、Wi-Fi認証情報、NVS・全フラッシュのダンプ、個人設定入りファームウェアも添付しないでください。
        投稿前に[README](https://github.com/roflsunriz/esp32-codex-usage/blob/main/README.md)と[既存Issue](https://github.com/roflsunriz/esp32-codex-usage/issues)を確認してください。
        脆弱性の報告は[SECURITY.md](https://github.com/roflsunriz/esp32-codex-usage/blob/main/SECURITY.md)の案内に従ってください。
  - type: checkboxes
    id: preflight
    attributes:
      label: 事前確認
      options:
        - label: 既存Issueを検索しました。
          required: false
        - label: 可能な範囲で最新の公開版でも確認しました。
          required: false
  - type: textarea
    id: legacy-1
    attributes:
      label: 概要
      description: 期待した結果と実際の結果を短く記載してください。
    validations:
      required: false
  - type: textarea
    id: legacy-2
    attributes:
      label: 対象と環境
      description: |-
        - ボード・LCD型番:
        - OS:
        - PlatformIO / 依存バージョン:
        - コミット:
    validations:
      required: false
  - type: textarea
    id: legacy-3
    attributes:
      label: 再現手順
      description: |-
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: legacy-4
    attributes:
      label: 期待した結果
    validations:
      required: false
  - type: textarea
    id: legacy-5
    attributes:
      label: 実際の結果
    validations:
      required: false
  - type: textarea
    id: legacy-6
    attributes:
      label: 診断情報
      description: 秘密情報を削除したログだけを貼ってください。Bearer token、Cookie、認証コード、Wi-Fiパスワード、フルフラッシュは貼らないでください。
    validations:
      required: false
  - type: textarea
    id: legacy-7
    attributes:
      label: 復旧状況
      description: |-
        - [ ] 実機へ書き込んでいない
        - [ ] 元フラッシュをバックアップ済み
        - [ ] 元ファームウェアへ復元済み
    validations:
      required: false
  - type: textarea
    id: additional-common
    attributes:
      label: 補足
      description: 発生頻度、直前の変更、回避策、確認できない条件を記載してください。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 公開情報の確認
      options:
        - label: 本文と添付に秘密情報や個人情報が含まれていないことを確認しました。
          required: true
