[platformio]
default_envs = cyd
core_dir = .local/platformio

[env:cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -Wall
  -Wextra
  -Wl,--wrap=dhcp_append_extra_opts
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DTOUCH_CS=-1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1

[env:cyd-diagnostics]
extends = env:cyd
build_flags = ${env:cyd.build_flags} -DUSAGE_DIAGNOSTICS

[env:native]
platform = native@1.2.1
test_build_src = no
extra_scripts = pre:scripts/native-toolchain.py
lib_deps =
  throwtheswitch/Unity@2.6.1
  bblanchon/ArduinoJson@7.4.3
build_flags = -std=c++17 -Iinclude
